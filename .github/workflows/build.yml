name: SonarQube Scan + PDF Report

on:
  push:
    branches:
      - main
  # Adds a "Run workflow" button in the Actions tab for manual runs
  workflow_dispatch:

jobs:
  sonarqube:
    name: Analyze and generate PDF report
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history gives better analysis

      # 2. Run the SonarQube scan (reads sonar-project.properties)
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 3. Check the Quality Gate. continue-on-error: a failed gate does NOT
      #    fail the run; the result (PASSED / FAILED) is shown in the PDF.
      - name: Quality Gate check
        id: qualitygate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # 4. Build the PDF from the SonarQube results
      - name: Set up Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate PDF report
        if: always()
        run: |
          pip install --quiet reportlab
          python .github/scripts/sonar_pdf_report.py
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          REPORT_FILE: Workiify-SonarQube-Report.pdf

      # 5. Attach the PDF to this run (download from the run page > Artifacts)
      - name: Upload PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report
          path: Workiify-SonarQube-Report.pdf
          retention-days: 30
          if-no-files-found: warn

      # 6. Show the Quality Gate result on the run page (the run itself stays green)
      - name: Quality Gate result
        if: always()
        run: |
          if [ "${{ steps.qualitygate.outcome }}" = "success" ]; then
            echo "## SonarQube Quality Gate: PASSED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::SonarQube Quality Gate did not pass - see the PDF report (Artifacts) for details."
            echo "## SonarQube Quality Gate: FAILED - see the PDF report in Artifacts" >> "$GITHUB_STEP_SUMMARY"
          fi
