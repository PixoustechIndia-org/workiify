<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 144 144" width="144" height="144" role="img" aria-label="Workiify chat assistant" class="wk-icon" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Chat with Workiify</title>
  <defs>
    <linearGradient id="wk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6b9bff"/><stop offset=".5" stop-color="#2f4fe8"/><stop offset="1" stop-color="#0e1a7a"/>
    </linearGradient>
    <linearGradient id="wk-slate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8c9bf5"/><stop offset="1" stop-color="#dfe6ff"/>
    </linearGradient>
    <linearGradient id="wk-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#e0f7ff"/>
    </linearGradient>
    <linearGradient id="wk-a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d6e2ff"/>
    </linearGradient>
    <linearGradient id="wk-shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wk-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc83d"/><stop offset="1" stop-color="#f4a62a"/>
    </linearGradient>
    <clipPath id="wk-clip">
      <circle cx="60" cy="56" r="48"/>
      <path d="M24,86 L12,112 L50,100 Z"/>
    </clipPath>
    <!-- left wing: 3 feather bars, stepping in toward the A -->
    <g id="wk-wing">
      <path class="wk-bar" style="--i:0" d="M27,31 L50,42 L49,48 L27,37.5 Z"/>
      <path class="wk-bar" style="--i:1" d="M30,46 L48,55 L47,61 L30,52 Z"/>
      <path class="wk-bar" style="--i:2" d="M34,60 L44,66 L43.5,72 L34,65.5 Z"/>
    </g>
  </defs>

  <style>
    .wk-icon { overflow: visible; }
    .wk-icon * { transform-box: fill-box; }
    .wk-icon .wk-mirror { transform-box: view-box; transform-origin: 0 0; }
    @keyframes wk-pop    { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes wk-barIn  { from { transform: translateX(-14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes wk-rise   { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }
    @keyframes wk-flap   { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(-4deg); } }
    @keyframes wk-float  { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2.5px); } }
    @keyframes wk-dot    { 0%,60%,100% { transform: translateY(0); opacity: .45; } 30% { transform: translateY(-4px); opacity: 1; } }
    @keyframes wk-glow   { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
    @keyframes wk-ring   { 0% { transform: scale(1); opacity: .5; } 70%,100% { transform: scale(1.28); opacity: 0; } }
    @keyframes wk-sweep  { 0% { transform: translateX(-60px) skewX(-20deg); } 40%,100% { transform: translateX(150px) skewX(-20deg); } }
    @keyframes wk-live   { 0%,100% { transform: scale(1); } 50% { transform: scale(1.25); } }

    .wk-ring   { transform-origin: 50% 50%; animation: wk-ring 3s ease-out 1.6s infinite; }
    .wk-body   { transform-origin: 50% 60%; animation: wk-pop .7s cubic-bezier(.3,1.4,.5,1) both; }
    .wk-float  { animation: wk-float 4.5s ease-in-out 1.6s infinite; }
    .wk-bar    { animation: wk-barIn .6s cubic-bezier(.2,.8,.2,1) calc(.35s + var(--i) * .12s) both; }
    .wk-flapL  { transform-origin: 50px 58px; animation: wk-flap 3.6s ease-in-out 1.6s infinite; }
    .wk-flapR  { transform-origin: 50px 58px; animation: wk-flap 3.6s ease-in-out 1.6s infinite; }
    .wk-glow   { animation: wk-glow 2.8s ease-in-out 1.6s infinite; }
    .wk-A      { transform-origin: 50% 100%; animation: wk-rise .6s cubic-bezier(.2,.8,.2,1) .25s both; }
    .wk-d      { animation: wk-dot 1.4s ease-in-out infinite; }
    .wk-d1     { animation-delay: 1s; } .wk-d2 { animation-delay: 1.17s; } .wk-d3 { animation-delay: 1.34s; }
    .wk-shine  { animation: wk-sweep 5.5s ease-in-out 2s infinite; }
    .wk-live   { transform-origin: 50% 50%; animation: wk-pop .5s ease-out 1s both, wk-live 2s ease-in-out 1.6s infinite; }

    @media (prefers-reduced-motion: reduce) { .wk-icon * { animation: none !important; } }
  </style>

  <circle class="wk-ring" cx="60" cy="56" r="48" fill="none" stroke="#4f7cff" stroke-width="2.5"/>

  <g class="wk-body">
    <!-- chat bubble -->
    <circle cx="60" cy="56" r="48" fill="url(#wk-bg)"/>
    <path d="M24,86 L12,112 L50,100 Z" fill="#1b2fc4" stroke="#1b2fc4" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="60" cy="56" r="47" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="1.2"/>

    <g class="wk-float">
      <!-- left wing (slate) -->
      <g class="wk-flapL"><use href="#wk-wing" fill="url(#wk-slate)"/></g>
      <!-- right wing (teal, mirrored) -->
      <g class="wk-mirror" transform="translate(120,0) scale(-1,1)">
        <g class="wk-flapR wk-glow"><use href="#wk-wing" fill="url(#wk-teal)"/></g>
      </g>
      <!-- the A -->
      <g class="wk-A">
        <path d="M60,19 Q62.5,19 63.5,22.5 L80,86 L71,86 L60,46 L49,86 L40,86 L56.5,22.5 Q57.5,19 60,19 Z" fill="url(#wk-a)"/>
      </g>
      <!-- typing dots in the A -->
      <circle class="wk-d wk-d1" cx="54.6" cy="73" r="2.6" fill="url(#wk-amber)"/>
      <circle class="wk-d wk-d2" cx="60"   cy="73" r="2.6" fill="url(#wk-amber)"/>
      <circle class="wk-d wk-d3" cx="65.4" cy="73" r="2.6" fill="url(#wk-amber)"/>
    </g>

    <!-- light sweep -->
    <g clip-path="url(#wk-clip)">
      <rect class="wk-shine" x="0" y="0" width="26" height="120" fill="url(#wk-shine)"/>
    </g>

    <!-- online dot -->
    <circle cx="101" cy="22" r="8" fill="#fff"/>
    <circle class="wk-live" cx="101" cy="22" r="5.5" fill="url(#wk-amber)"/>
  </g>
</svg>