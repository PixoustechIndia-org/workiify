# SonarQube settings for the Workiify website + CMS (read by the GitHub workflow and the PDF report step).
sonar.projectKey=workiify
sonar.projectName=Workiify Website and CMS
sonar.sourceEncoding=UTF-8

# The project has no automated unit tests, so there is no coverage report to measure.
# Code is still fully scanned for bugs, vulnerabilities and code smells.
sonar.coverage.exclusions=**/*

# Page templates and stylesheets repeat the same HTML/CSS layout on purpose (list screens,
# section cards), so they are left out of the copy-paste (duplication) metric only.
sonar.cpd.exclusions=app/views/**,public/css/**
