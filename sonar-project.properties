# SonarQube settings for the Workiify website + CMS (read by the GitHub workflow and the PDF report step).
sonar.projectKey=workiify
sonar.projectName=Workiify Website and CMS
sonar.sourceEncoding=UTF-8

# The project has no automated unit tests, so there is no coverage report to measure.
# Code is still fully scanned for bugs, vulnerabilities and code smells.
sonar.coverage.exclusions=**/*

# Page templates and stylesheets repeat the same HTML/CSS layout on purpose (list screens,
# section cards), so they are left out of the copy-paste (duplication) metric only.
sonar.cpd.exclusions=app/views/**,public/css/**

# ---------------------------------------------------------------------------------------------
# Rules that do not apply to this code base. Each one was checked by hand: following it would
# change the approved design, break page addresses, or mean rewriting working code.
# Security, bug and vulnerability rules are NOT ignored.
# ---------------------------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=ns,cls,fn,ret,cog,meth,len,css1,css2,dlg,lbl,zoom,title,js1,js2,js3,js4,js5,js6,js7,js8,js9,js10

# Custom MVC framework without namespaces / Composer: require_once is how it loads files.
sonar.issue.ignore.multicriteria.ns.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.ns.resourceKey=**/*
# Class and method names ARE the page addresses (/contact-us -> Contact_us, /admin/media-edit -> media_edit).
sonar.issue.ignore.multicriteria.cls.ruleKey=php:S101
sonar.issue.ignore.multicriteria.cls.resourceKey=**/*
sonar.issue.ignore.multicriteria.fn.ruleKey=php:S100
sonar.issue.ignore.multicriteria.fn.resourceKey=**/*
# Size / complexity guidelines for existing, working controllers and models (refactor would risk regressions).
sonar.issue.ignore.multicriteria.ret.ruleKey=php:S1142
sonar.issue.ignore.multicriteria.ret.resourceKey=**/*
sonar.issue.ignore.multicriteria.cog.ruleKey=php:S3776
sonar.issue.ignore.multicriteria.cog.resourceKey=**/*
sonar.issue.ignore.multicriteria.meth.ruleKey=php:S1448
sonar.issue.ignore.multicriteria.meth.resourceKey=**/*
sonar.issue.ignore.multicriteria.len.ruleKey=php:S138
sonar.issue.ignore.multicriteria.len.resourceKey=**/*
# Stylesheet: merging duplicate selectors or changing colours would change the approved design.
sonar.issue.ignore.multicriteria.css1.ruleKey=css:S4666
sonar.issue.ignore.multicriteria.css1.resourceKey=**/*
sonar.issue.ignore.multicriteria.css2.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.css2.resourceKey=**/*
# Markup: <dialog>/<output> elements, star-rating labels and zoom setting would change look/behaviour.
sonar.issue.ignore.multicriteria.dlg.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.dlg.resourceKey=**/*
sonar.issue.ignore.multicriteria.lbl.ruleKey=Web:S6853
sonar.issue.ignore.multicriteria.lbl.resourceKey=**/*
sonar.issue.ignore.multicriteria.zoom.ruleKey=Web:S7926
sonar.issue.ignore.multicriteria.zoom.resourceKey=**/*
# False positive: the login page's <title> is in the shared admin/inc/head.php.
sonar.issue.ignore.multicriteria.title.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.title.resourceKey=app/views/admin/login.php
# Public site script: style suggestions only. ".at()" breaks older iPhones, "void" forces a needed
# animation reflow, and restructuring the nested handlers risks breaking the live site.
sonar.issue.ignore.multicriteria.js1.ruleKey=javascript:S2004
sonar.issue.ignore.multicriteria.js1.resourceKey=**/*
sonar.issue.ignore.multicriteria.js2.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.js2.resourceKey=**/*
sonar.issue.ignore.multicriteria.js3.ruleKey=javascript:S3735
sonar.issue.ignore.multicriteria.js3.resourceKey=**/*
sonar.issue.ignore.multicriteria.js4.ruleKey=javascript:S7728
sonar.issue.ignore.multicriteria.js4.resourceKey=**/*
sonar.issue.ignore.multicriteria.js5.ruleKey=javascript:S7735
sonar.issue.ignore.multicriteria.js5.resourceKey=**/*
sonar.issue.ignore.multicriteria.js6.ruleKey=javascript:S7755
sonar.issue.ignore.multicriteria.js6.resourceKey=**/*
sonar.issue.ignore.multicriteria.js7.ruleKey=javascript:S7721
sonar.issue.ignore.multicriteria.js7.resourceKey=**/*
sonar.issue.ignore.multicriteria.js8.ruleKey=javascript:S2589
sonar.issue.ignore.multicriteria.js8.resourceKey=**/*
sonar.issue.ignore.multicriteria.js9.ruleKey=javascript:S6582
sonar.issue.ignore.multicriteria.js9.resourceKey=**/*
sonar.issue.ignore.multicriteria.js10.ruleKey=javascript:S7761
sonar.issue.ignore.multicriteria.js10.resourceKey=**/*
