# SonarQube / SonarCloud scanner settings for Workiify (PHP MVC + HTML/CSS/JS)
sonar.projectKey=workiify
sonar.projectName=Workiify Website and CMS
sonar.sourceEncoding=UTF-8

sonar.sources=app,public
# Only media/binary/runtime folders are excluded; all application code stays analysed.
sonar.exclusions=public/images/**,public/uploads/**,public/**/*.pdf,app/config/config.local.php

# Uncomment once PHPUnit tests exist (phpunit --coverage-clover coverage/clover.xml):
# sonar.tests=tests
# sonar.php.coverage.reportPaths=coverage/clover.xml
