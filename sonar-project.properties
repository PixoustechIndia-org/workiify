# SonarQube settings for the Workiify website + CMS.
# Project key, server, token and which folders to scan are all set by the GitHub workflow.
# This file ONLY lists rules that do not apply to this code base, so the report shows real
# issues. Each ignore below was checked by hand: "fixing" these would break the site.

sonar.issue.ignore.multicriteria=views_require_once,namespaces,class_names,function_names,template_dup_ids,template_conditional,login_title,controller_view_data

# 1. "Replace require with require_once" in views: partials such as admin/inc/field_input.php are
#    deliberately included once PER FIELD; require_once would render only the first field.
sonar.issue.ignore.multicriteria.views_require_once.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.views_require_once.resourceKey=app/views/**/*

# 2. "Use namespaces + use instead of require": this is a small custom MVC framework without an
#    autoloader for views/config; switching to namespaces is a rewrite, not a fix.
sonar.issue.ignore.multicriteria.namespaces.ruleKey=php:S4833
sonar.issue.ignore.multicriteria.namespaces.resourceKey=**/*

# 3. Class names like About_us / Contact_us / Home_content_model: the router maps the URL
#    /about-us to the class About_us, so renaming them changes or breaks every page address.
sonar.issue.ignore.multicriteria.class_names.ruleKey=php:S101
sonar.issue.ignore.multicriteria.class_names.resourceKey=app/**/*

# 4. Function names like item_edit / enquiry_view: the router maps /admin/item-edit to item_edit().
sonar.issue.ignore.multicriteria.function_names.ruleKey=php:S100
sonar.issue.ignore.multicriteria.function_names.resourceKey=app/**/*

# 5. "Duplicate id" in templates: the two ids are in opposite branches of an if/else, so only one
#    is ever sent to the browser.
sonar.issue.ignore.multicriteria.template_dup_ids.ruleKey=Web:S7930
sonar.issue.ignore.multicriteria.template_dup_ids.resourceKey=app/views/**/*

# 6. "Statement not executed conditionally" in templates: false positive on PHP's alternative
#    syntax (`foreach (...): if (...) continue; ?>`); the code runs as intended.
sonar.issue.ignore.multicriteria.template_conditional.ruleKey=php:S2681
sonar.issue.ignore.multicriteria.template_conditional.resourceKey=app/views/**/*

# 7. Login page "missing <title>": the <title> is in the included admin/inc/head.php.
sonar.issue.ignore.multicriteria.login_title.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.login_title.resourceKey=app/views/admin/login.php

# 8. Controller::view($view, $data) "unused $data": the included view file uses $data.
sonar.issue.ignore.multicriteria.controller_view_data.ruleKey=php:S1172
sonar.issue.ignore.multicriteria.controller_view_data.resourceKey=app/libraries/Controller.php
